<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuCalculadoraSAT | Tipo de Cambio Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a56db; --bg: #f9fafb; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #111827; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; }
        .card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 30px; border: 1px solid #e5e7eb; }
        .logo { text-align: center; color: var(--primary); font-weight: 800; font-size: 1.6rem; margin-bottom: 25px; }
        .tc-box { text-align: center; margin-bottom: 30px; padding: 15px; border-bottom: 1px solid #f3f4f6; }
        .tc-val { font-size: 2.8rem; font-weight: 700; color: var(--primary); display: block; line-height: 1; }
        .label { font-size: 0.75rem; color: #6b7280; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; font-size: 1.3rem; border: 2px solid #e5e7eb; border-radius: 10px; margin: 10px 0 20px 0; box-sizing: border-box; transition: all 0.2s; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.1); }
        .result { background: #f0fdf4; border: 1px solid #dcfce7; padding: 20px; border-radius: 12px; text-align: center; }
        .res-val { font-size: 2.2rem; font-weight: 800; color: #15803d; }
        .trust { background: #eff6ff; border-left: 4px solid var(--primary); padding: 15px; font-size: 0.85rem; margin-top: 25px; color: #1e42af; border-radius: 4px; }
        #fecha { font-size: 0.8rem; color: #9ca3af; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">TuCalculadoraSAT</div>
    
    <div class="card">
        <div class="tc-box">
            <span class="label">Dólar FIX (Banxico Oficial)</span>
            <span id="tc-valor" class="tc-val">0.0000</span>
            <small id="fecha">Sincronizando con Banxico...</small>
        </div>

        <label class="label">Monto en Dólares (USD)</label>
        <input type="number" id="usd" placeholder="0.00" oninput="calcular()" autofocus>

        <div class="result">
            <span class="label" style="color: #166534;">Resultado SAT (Pesos MXN)</span>
            <div class="res-val">$ <span id="res">0.0000</span></div>
        </div>

        <div class="trust">
            <strong>✓ Fuente Oficial:</strong> Datos directos de Banxico. Válido para CFF Art. 20 (Contabilidad y Facturación).
        </div>
    </div>
</div>

<script>
    // --- PEGA TU TOKEN AQUÍ ---
    const MI_TOKEN = '19c001bf446f62cf3a246ce8df5b34bff4bab4fd60f8527c84c2abc8f0becc61'; 
    let tcGlobal = 0;

    async function obtenerTC() {
        try {
            // Serie SF43718 (FIX)
            const response = await fetch(`https://www.banxico.org.mx/SieAPIRest/service/v1/series/SF43718/datos/oportuno?token=${MI_TOKEN}`);
            const json = await response.json();
            const ultimoDato = json.bmx.series[0].datos[0];
            
            tcGlobal = parseFloat(ultimoDato.dato);
            
            document.getElementById('tc-valor').innerText = tcGlobal.toFixed(4);
            document.getElementById('fecha').innerText = 'Publicado el: ' + ultimoDato.fecha;
            
        } catch (error) {
            console.error("Error al obtener datos:", error);
            document.getElementById('tc-valor').innerText = "Error";
            document.getElementById('fecha').innerText = "Revisa tu token en el código.";
        }
    }

    function calcular() {
        const inputUsd = document.getElementById('usd').value;
        const displayMxn = document.getElementById('res');
        
        if (inputUsd > 0 && tcGlobal > 0) {
            const operacion = inputUsd * tcGlobal;
            displayMxn.innerText = operacion.toLocaleString('es-MX', {
                minimumFractionDigits: 4,
                maximumFractionDigits: 4
            });
        } else {
            displayMxn.innerText = "0.0000";
        }
    }

    obtenerTC();
</script>

</body>
</html>

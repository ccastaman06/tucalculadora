<script>
    const TOKEN = '19c001bf446f62cf3a246ce8df5b34bff4bab4fd60f8527c84c2abc8f0becc61'; 
    let vL = 0, vF = 0;

    async function init() {
        const proxy = "https://api.allorigins.win/get?url=";
        // Pedimos los últimos 5 datos de ambas series para poder elegir el correcto manualmente
        const apiMain = `https://www.banxico.org.mx/SieAPIRest/service/v1/series/SF60653,SF43718/datos/2026-03-10/2026-03-17?token=${TOKEN}`;

        try {
            const r1 = await fetch(proxy + encodeURIComponent(apiMain));
            const j1 = await r1.json();
            const series = JSON.parse(j1.contents).bmx.series;
            
            series.forEach(s => {
                if(s.idSerie === 'SF60653') {
                    // LÓGICA DE ORO: Para liquidación, el valor vigente hoy es el PENÚLTIMO dato 
                    // publicado (el del día hábil anterior).
                    const datos = s.datos;
                    const penultimo = datos[datos.length - 2]; 
                    const ultimo = datos[datos.length - 1];

                    // Si el último dato tiene fecha de hoy, legalmente el de liquidación es el anterior.
                    vL = parseFloat(penultimo.dato);
                    document.getElementById('v-liq').innerText = vL.toFixed(4);
                    document.getElementById('f-liq').innerText = penultimo.fecha;
                    
                    // Llenar historial con los datos restantes
                    let hMarkup = '';
                    datos.reverse().forEach(h => {
                        hMarkup += `<div class="hist-day">
                                        <span class="h-fec">${h.fecha}</span>
                                        <span class="h-val">${parseFloat(h.dato).toFixed(4)}</span>
                                    </div>`;
                    });
                    document.getElementById('historial').innerHTML = hMarkup;

                } else if(s.idSerie === 'SF43718') {
                    // Para el FIX, sí queremos el más reciente (el de hoy)
                    const ultimoFIX = s.datos[s.datos.length - 1];
                    vF = parseFloat(ultimoFIX.dato);
                    document.getElementById('v-fix').innerText = vF.toFixed(4);
                    document.getElementById('f-fix').innerText = ultimoFIX.fecha;
                }
            });

        } catch (e) {
            console.error("Error de sincronización.");
        }
    }
    // ... resto de tus funciones de cálculo e imprimir ...
</script>
